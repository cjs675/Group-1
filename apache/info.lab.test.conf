<VirtualHost *:80>
    ServerName info.lab.test
    Redirect permanent / https://info.lab.test/
</VirtualHost>

<VirtualHost *:443>
    ServerName info.lab.test
    DocumentRoot /var/www/info.lab.test/html

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/lab.test.crt
    SSLCertificateKeyFile /etc/pki/tls/private/lab.test.key

    <Directory /var/www/info.lab.test/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /admin /var/www/info.lab.test/admin
    <Directory /var/www/info.lab.test/admin>
        AuthType Basic
        AuthName "Restricted Administrative Area"
        AuthUserFile /etc/httpd/.htpasswd
        Require valid-user
    </Directory>

    ErrorLog /var/log/httpd/info.lab.test-error.log
    CustomLog /var/log/httpd/info.lab.test-access.log combined
</VirtualHost>
