<VirtualHost *:80>
    ServerName app.lab.test
    Redirect permanent / https://app.lab.test/
</VirtualHost>

<VirtualHost *:443>
    ServerName app.lab.test
    DocumentRoot /var/www/app.lab.test/html

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/lab.test.crt
    SSLCertificateKeyFile /etc/pki/tls/private/lab.test.key

    <Directory /var/www/app.lab.test/html>
        DirectoryIndex index.php index.html
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/app.lab.test-error.log
    CustomLog /var/log/httpd/app.lab.test-access.log combined
</VirtualHost>
